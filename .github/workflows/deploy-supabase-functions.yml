name: Deploy Supabase Edge Functions

# Touching this workflow intentionally retriggers the full deployment chain.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Validate deployment secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing SUPABASE_PROJECT_ID"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy chat function
        run: supabase functions deploy chat --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy scheduler function
        run: supabase functions deploy scheduler --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy game proxy function
        run: supabase functions deploy game-proxy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy MCP host function
        run: supabase functions deploy mcp-host --project-ref "$SUPABASE_PROJECT_ID"
